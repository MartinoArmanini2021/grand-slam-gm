name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Only one CI run per branch at a time — a newer push cancels the older run. Stops two runs
# racing the SHARED live database via the `boundary` job (dev/prod aren't isolated yet), and
# saves minutes. (When a dedicated dev DB lands, the boundary job can also run on PRs.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit suite + a real build. `npm run build` runs `tsc -b && vite build`, so a type error
  # (like the node:fs one that skipped a build and shipped stale dist) FAILS CI here.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint   # oxlint — gates on real correctness ERRORS only (the existing style warnings don't fail)
      - run: npm run build
      - run: npm test   # integration drift test self-skips without GSGM_TEST_JWT

  # The DB-level SECURITY BOUNDARY + RPC↔TS drift check. It hits the live database, so it needs
  # a dedicated TEST USER. We mint the JWT here from stored secrets (never hand-pasted), so this
  # boundary can't quietly become "untested". Requires save_entry_rpc.sql applied to the target DB.
  # Repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY, TEST_EMAIL, TEST_PASSWORD.
  boundary:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Sign in the test user and mint a JWT
        id: jwt
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          EMAIL: ${{ secrets.TEST_EMAIL }}
          PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          TOKEN=$(curl -s -X POST "$URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON" -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write((JSON.parse(d).access_token)||''))")
          if [ -z "$TOKEN" ]; then echo "::error::Could not mint a test-user JWT"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: RPC ↔ TS drift + raw-PATCH-403 boundary
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GSGM_TEST_JWT: ${{ steps.jwt.outputs.token }}
        run: npx vitest run src/__tests__/rpcDrift.integration.test.ts
